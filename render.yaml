# Render deployment config
services:
  - type: web
    name: agcra-webhook
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: TARGET_REPO
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: REVIEW_MODEL
        value: llama-3.3-70b-versatile
    healthCheckPath: /health
    autoDeploy: true
